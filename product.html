<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DFWIN Product</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background:#07111f; color:#e5e7eb; }
    .glass { background:rgba(15,23,42,.78); border:1px solid rgba(255,255,255,.10); }
    .spec-row { border-bottom:1px solid rgba(255,255,255,.08); }
  </style>
<script src="rfq-config.js"></script>
</head>
<body>
  <header class="border-b border-white/10 bg-slate-900/80">
  <nav class="max-w-5xl mx-auto px-5 py-5 flex flex-wrap gap-5 text-cyan-200 text-sm font-semibold" aria-label="V2 Navigation">
    <a href="index_V2.html">Home</a><a href="catalog_NEW.html">Product Catalog</a><a href="about_V2.html">About Us</a>
    <a href="solution-portal_V2.html?action=consult">Consult an Expert</a><a href="catalog_NEW.html#rfq-basket">RFQ Basket</a>
  </nav>
</header>
<main class="max-w-5xl mx-auto px-5 py-10">
    <a id="back-to-catalog" href="catalog_NEW.html" class="text-cyan-400 text-sm">&larr; Back to results</a>
    <section id="product" class="glass rounded-2xl p-6 md:p-8 mt-5"></section>
  </main>

<script>
const DATA_URL = 'products.json';

// Restore the exact search, category, subcategory and scroll position used to open this product.
// Only allow a local catalog page as the return target (never arbitrary external URLs).
const returnTarget = new URLSearchParams(location.search).get('return');
if (returnTarget) {
  try {
    const parsed = new URL(returnTarget, location.href);
    const filename = parsed.pathname.split('/').pop();
    if (parsed.origin === location.origin &&
        ['catalog_NEW.html'].includes(filename) &&
        parsed.pathname.replace(/[^/]+$/, '') === location.pathname.replace(/[^/]+$/, '')) {
      document.getElementById('back-to-catalog').href = parsed.pathname + parsed.search;
    }
  } catch (_) { /* Fall back to the test catalog. */ }
}

function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function init() {
  const params = new URLSearchParams(location.search);
  const slug = params.get('product');
  const data = await fetch(DATA_URL, {cache:'no-store'}).then(r => r.json());
  const product = data.products.find(p => p.slug === slug && p.status === 'Active');
  const root = document.getElementById('product');

  if (!product) {
    root.innerHTML = '<h1 class="text-2xl font-bold">Product not found</h1>';
    return;
  }

  const specs = data.specifications
    .filter(s => s.product_id === product.product_id && s.public)
    .sort((a,b) => a.display_order - b.display_order);

  document.title = `${product.name} | DFWIN International`;

  root.innerHTML = `
    <div class="grid md:grid-cols-[240px_1fr] gap-8 items-start">
      <div class="bg-white rounded-xl p-4">
        <img src="images/${esc(product.primary_image)}" alt="${esc(product.name)}" class="w-full h-auto object-contain">
      </div>
      <div>
        <div class="text-cyan-400 text-sm font-semibold uppercase tracking-wider">${esc(product.category)}</div>
        <h1 class="text-3xl md:text-4xl font-bold mt-2">${esc(product.name)}</h1>
        <p class="text-gray-300 mt-4 leading-relaxed">${esc(product.short_description)}</p>
        <h2 class="text-xl font-bold mt-8 mb-3">Specifications</h2>
        <div>
          ${specs.length ? specs.map(s => `
            <div class="spec-row grid grid-cols-[1fr_1fr] gap-4 py-3">
              <div class="text-gray-400">${esc(s.specification)}</div>
              <div class="font-semibold">${esc(s.value)}${s.unit ? ' ' + esc(s.unit) : ''}</div>
            </div>`).join('') : '<p class="text-gray-400">Detailed specifications are being prepared. Please request product information below.</p>'}
        </div>
        <div class="flex flex-wrap gap-3 mt-8">
          <button id="add-to-rfq" type="button" class="bg-cyan-500 text-slate-950 font-bold rounded-full px-6 py-3">Add to RFQ basket</button>
          <button id="request-single-rfq" type="button" class="border border-cyan-500 text-cyan-300 rounded-full px-6 py-3 font-bold">Request quote now</button>
          <a href="${esc(product.request_quote_url)}" class="text-gray-200 underline p-3">Contact DFWin</a>
        </div>
      </div>
    </div>`;

  const entry={product_id:product.product_id,product_name:product.name,quantity:null};
  document.getElementById('add-to-rfq').addEventListener('click',()=>{
    let basket=[];try{basket=JSON.parse(localStorage.getItem('dfwin_rfq_basket_v2')||'[]');if(!Array.isArray(basket))basket=[];}catch(_){}
    const prior=basket.find(x=>x.product_id===entry.product_id);
    if(!prior)basket.push(entry);
    localStorage.setItem('dfwin_rfq_basket_v2',JSON.stringify(basket));
    alert(product.name+' added to your RFQ basket. Return to the catalog to submit.');
  });
  document.getElementById('request-single-rfq').addEventListener('click',()=>{
    if(window.DFWIN_RFQ_URL)window.open(window.DFWIN_RFQ_URL+'?items='+encodeURIComponent(JSON.stringify([entry])),'_blank','noopener');
    else location.href=product.request_quote_url||'solution-portal_V2.html?action=consult';
  });
  // Machine-readable Product schema for search/procurement agents.
  const schema = {
    "@context":"https://schema.org",
    "@type":"Product",
    "sku":product.product_id,
    "name":product.name,
    "category":product.category,
    "description":product.short_description,
    "image":new URL(`images/${product.primary_image}`, location.href).href,
    "manufacturer":{"@type":"Organization","name":"DFWIN International"},
    "url":location.href,
    "additionalProperty":specs.filter(s=>s.verified && s.value && s.value !== 'TBD').map(s=>({
      "@type":"PropertyValue","name":s.specification,"value":s.value,"unitText":s.unit||undefined
    }))
  };
  const ld = document.createElement('script');
  ld.type = 'application/ld+json';
  ld.textContent = JSON.stringify(schema);
  document.head.appendChild(ld);
}
init().catch(() => {
  document.getElementById('product').innerHTML =
    '<h1 class="text-2xl font-bold">Product information is temporarily unavailable.</h1>';
});
</script>
</body>
</html>
