<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Catalog | DFWIN International</title>

    <meta
        name="description"
        content="Browse DFWIN International Technology, Hospitality and Marine products."
    >

    <script src="https://cdn.tailwindcss.com"></script>

    <script
        defer
        src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js">
    </script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: '#020b18',
                        panel: '#04152d',
                        accent: '#06b6d4',
                        primary: '#3b82f6'
                    },

                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Outfit', 'sans-serif']
                    }
                }
            }
        };
    </script>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;800&display=swap"
        rel="stylesheet"
    >

    <style>

        body {
            background-color: #020b18;
            color: #f8fafc;
            overflow-x: hidden;
            font-family: 'Inter', sans-serif;
        }

        .mesh-bg {
            background-color: #020b18;

            background-image:
                radial-gradient(
                    at 0% 0%,
                    rgba(34, 211, 238, 0.15) 0px,
                    transparent 50%
                ),
                radial-gradient(
                    at 100% 100%,
                    rgba(59, 130, 246, 0.15) 0px,
                    transparent 50%
                );

            background-attachment: fixed;
        }

        .glass-nav {
            background: rgba(4, 21, 45, 0.6);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .filter-box {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /*
        ==========================================================
        PRODUCT IMAGE CARD
        ==========================================================
        */

        .catalog-card {
            background: #ffffff;
            border-radius: 16px;
            min-height: 310px;
            height: 310px;

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;
            overflow: hidden;

            border: 1px solid rgba(255, 255, 255, 0.12);

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.22);

            transition:
                border-color 0.25s ease,
                box-shadow 0.25s ease;
        }

        /*
        IMPORTANT:
        The card itself DOES NOT move upward.
        */

        .catalog-card:hover {
            border-color: rgba(34, 211, 238, 0.65);

            box-shadow:
                0 15px 35px rgba(6, 182, 212, 0.20);
        }

        /*
        IMAGE
        */

        .catalog-image {
            width: 100%;
            height: 100%;

            object-fit: contain;

            padding: 18px;

            transition:
                transform 0.45s ease;

            transform-origin: center center;
        }

        /*
        Only the image enlarges.
        */

        .catalog-card:hover .catalog-image {
            transform: scale(1.22);
        }

        /*
        If an image has not yet been uploaded or the filename
        does not exactly match, show a small diagnostic message.
        */

        .missing-image {
            display: none;

            position: absolute;
            inset: 0;

            align-items: center;
            justify-content: center;

            text-align: center;

            background: #ffffff;
            color: #334155;

            padding: 25px;

            font-size: 12px;
            font-weight: 700;

            word-break: break-word;
        }

        [x-cloak] {
            display: none !important;
        }

    </style>
</head>


<body class="mesh-bg antialiased flex flex-col min-h-screen">


    <!-- ======================================================
         GLOBAL NAVIGATION
         ====================================================== -->

    <nav class="fixed w-full z-50 glass-nav">

        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

            <div class="flex justify-between items-center h-20">

                <div class="flex-shrink-0 flex items-center gap-3">

                    <img
                        src="images/dfwin_logo_dark.jpg"
                        alt="DFWIN Logo"
                        class="w-32 h-16 rounded-[50%] mix-blend-screen object-cover shadow-[0_0_15px_rgba(34,211,238,0.2)]"
                    >

                </div>


                <div class="hidden md:flex space-x-8 items-center">

                    <a
                        href="index.html"
                        class="text-gray-300 hover:text-white transition-colors text-sm font-semibold tracking-wide">
                        Home
                    </a>

                    <a
                        href="catalog.html"
                        class="text-white border-b-2 border-cyan-400 pb-1 text-sm font-semibold tracking-wide">
                        Product Catalog
                    </a>

                    <a
                        href="about.html"
                        class="text-gray-300 hover:text-white transition-colors text-sm font-semibold tracking-wide">
                        About Us
                    </a>

                    <a
                        href="solution-portal.html?action=consult"
                        class="bg-cyan-500 hover:bg-cyan-400 text-dark px-6 py-2.5 rounded-full font-bold transition-all duration-300 shadow-[0_0_15px_rgba(6,182,212,0.3)] text-sm">
                        Consult an Expert
                    </a>

                </div>

            </div>

        </div>

    </nav>



    <!-- ======================================================
         PRODUCT CATALOG
         ====================================================== -->

    <main
        class="flex-grow pt-32 pb-24 relative"
        x-data="catalogApp()"
    >

        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">


            <!-- PAGE TITLE + CATEGORY BUTTONS -->

            <div
                class="flex flex-col md:flex-row justify-between items-end mb-10 gap-6"
            >

                <div class="max-w-2xl">

                    <h1
                        class="text-4xl md:text-5xl font-display font-bold mb-4 text-white"
                    >
                        Our Complete Catalog
                    </h1>

                    <p class="text-gray-400">
                        Browse our Technology, Hospitality and Marine product collections.
                    </p>

                </div>


                <!-- CATEGORY FILTERS -->

                <div
                    class="flex flex-wrap gap-2 p-1.5 filter-box rounded-xl"
                >

                    <button
                        @click="filter = 'all'"
                        :class="
                            filter === 'all'
                            ? 'bg-cyan-500 text-dark shadow-md'
                            : 'text-gray-400 hover:text-white'
                        "
                        class="px-5 py-2 rounded-lg text-sm font-bold transition-all"
                    >
                        All Products
                    </button>


                    <button
                        @click="filter = 'technology'"
                        :class="
                            filter === 'technology'
                            ? 'bg-cyan-500 text-dark shadow-md'
                            : 'text-gray-400 hover:text-white'
                        "
                        class="px-5 py-2 rounded-lg text-sm font-bold transition-all"
                    >
                        Technology
                    </button>


                    <button
                        @click="filter = 'hospitality'"
                        :class="
                            filter === 'hospitality'
                            ? 'bg-cyan-500 text-dark shadow-md'
                            : 'text-gray-400 hover:text-white'
                        "
                        class="px-5 py-2 rounded-lg text-sm font-bold transition-all"
                    >
                        Hospitality
                    </button>


                    <button
                        @click="filter = 'marine'"
                        :class="
                            filter === 'marine'
                            ? 'bg-cyan-500 text-dark shadow-md'
                            : 'text-gray-400 hover:text-white'
                        "
                        class="px-5 py-2 rounded-lg text-sm font-bold transition-all"
                    >
                        Marine
                    </button>

                </div>

            </div>



            <!-- ==================================================
                 IMAGE-ONLY PRODUCT GRID
                 ================================================== -->

            <div
                x-cloak
                class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"
            >

                <template
                    x-for="product in filteredProducts"
                    :key="product.filename"
                >

                    <div class="catalog-card">

                        <img
                            class="catalog-image"
                            :src="'images/' + product.filename"
                            :alt="product.name"
                            :title="product.name"
                            loading="lazy"

                            @error="
                                $el.style.display = 'none';
                                $el.nextElementSibling.style.display = 'flex';
                            "
                        >

                        <div
                            class="missing-image"
                            x-text="'Image filename not found: ' + product.filename"
                        >
                        </div>

                    </div>

                </template>

            </div>

        </div>

    </main>



    <!-- ======================================================
         FOOTER
         ====================================================== -->

    <footer
        class="py-12 border-t border-white/10 text-center mt-auto"
    >

        <div class="max-w-7xl mx-auto px-4">

            <p
                class="text-gray-400 mb-6 font-medium tracking-wide"
            >
                &copy; 2026 DFWIN International.
                We develop the most effective global supply chain.
            </p>


            <div
                class="flex flex-wrap justify-center gap-8"
            >

                <a
                    href="catalog.html"
                    class="text-sm font-semibold text-gray-500 hover:text-cyan-400 transition-colors uppercase tracking-widest"
                >
                    Products
                </a>


                <a
                    href="solution-portal.html?action=engineering"
                    class="text-sm font-semibold text-gray-500 hover:text-cyan-400 transition-colors uppercase tracking-widest"
                >
                    Engineer New Product
                </a>


                <a
                    href="solution-portal.html?action=consult"
                    class="text-sm font-semibold text-gray-500 hover:text-cyan-400 transition-colors uppercase tracking-widest"
                >
                    Request Consultation
                </a>

            </div>

        </div>

    </footer>



    <!-- ======================================================
         CATALOG DATA
         ====================================================== -->

    <script>

        function catalogApp() {

            const products = [];


            /*
            ------------------------------------------------------
            Helper functions
            ------------------------------------------------------
            */

            function add(category, name, extension = 'png') {

                products.push({

                    category: category.toLowerCase(),

                    name: name,

                    filename:
                        category +
                        '__' +
                        name +
                        '.' +
                        extension

                });

            }


            function series(
                category,
                name,
                count,
                extension = 'png',
                separator = ' '
            ) {

                for (let number = 1; number <= count; number++) {

                    products.push({

                        category: category.toLowerCase(),

                        name: name,

                        filename:
                            category +
                            '__' +
                            name +
                            separator +
                            number +
                            '.' +
                            extension

                    });

                }

            }


            function dashSeries(
                category,
                name,
                count,
                extension = 'png'
            ) {

                series(
                    category,
                    name,
                    count,
                    extension,
                    ' - '
                );

            }



            /*
            ======================================================
            TECHNOLOGY
            ======================================================
            */

            series(
                'Technology',
                'RFID Wrist Bands',
                2
            );

            add(
                'Technology',
                'Hotel Key Card'
            );

            series(
                'Technology',
                'RFID Key Fob',
                2
            );



            /*
            ======================================================
            MARINE
            ======================================================
            */

            add(
                'Marine',
                'Mooring Rope JIUMAX'
            );

            series(
                'Marine',
                'Life Jackets',
                2
            );

            add(
                'Marine',
                'Mooring Rope Flex'
            );

            add(
                'Marine',
                'Mooring Rope - KARAT MAXI'
            );

            series(
                'Marine',
                'LED Lights',
                3
            );

            add(
                'Marine',
                'Mooring Rope Super Line'
            );

            series(
                'Marine',
                'Life Jacket Light',
                2
            );



            /*
            ======================================================
            HOSPITALITY
            ======================================================
            */


            /* Laundry */

            series(
                'Hospitality',
                'Laundry Cage',
                2
            );


            /*
            First Melamine Green Edge collection
            */

            series(
                'Hospitality',
                'Melamine Green Edge',
                17
            );


            /*
            Trash Bins
            */

            series(
                'Hospitality',
                'Trash Bins',
                4
            );

            dashSeries(
                'Hospitality',
                'Trash Bins Series 2',
                5
            );


            /*
            Drinkware
            */

            series(
                'Hospitality',
                'Color Changing Plastic Mugs',
                2
            );


            /*
            Housekeeping carts
            */

            series(
                'Hospitality',
                'Compact Housekeeping Carts',
                3
            );

            dashSeries(
                'Hospitality',
                'Luggage Cages Series 2',
                3
            );


            /*
            Trolleys
            */

            series(
                'Hospitality',
                'Two Tier Trolley',
                3
            );

            add(
                'Hospitality',
                'Three Shelf Trolley'
            );


            /*
            Towels
            */

            add(
                'Hospitality',
                'Plush Bath Towels'
            );

            dashSeries(
                'Hospitality',
                'Plush Bath Towels Series 2',
                2
            );

            add(
                'Hospitality',
                'Plush Bath Towels Series 3'
            );


            /*
            Bellman carts
            */

            series(
                'Hospitality',
                'Bellman Carts',
                4
            );


            /*
            Flat Trucks
            */

            series(
                'Hospitality',
                'Flat Truck',
                3
            );


            /*
            Barricade
            */

            add(
                'Hospitality',
                'Barricade'
            );


            /*
            Hotel Safes
            */

            series(
                'Hospitality',
                'Hotel Safe',
                5
            );


            /*
            LED Lights
            */

            series(
                'Hospitality',
                'LED Lights',
                3
            );


            /*
            Light Up Glass
            */

            add(
                'Hospitality',
                'Light Up Glass',
                'jpg'
            );

            add(
                'Hospitality',
                'Light Up Glass 2',
                'jpg'
            );

            add(
                'Hospitality',
                'Light Up Glass 3',
                'jpg'
            );


            /*
            Chinaware - Yuanfeng 01
            */

            dashSeries(
                'Hospitality',
                'Chinaware - Yuanfeng 01',
                16
            );


            /*
            Linen carts
            */

            series(
                'Hospitality',
                'Linen Cart',
                3
            );


            /*
            Speed rack
            */

            add(
                'Hospitality',
                'Speed Rack 7 Shelves'
            );


            /*
            Plush towels
            */

            add(
                'Hospitality',
                'Plush Towels Series 3'
            );


            /*
            Trash Bins Series 1A
            */

            dashSeries(
                'Hospitality',
                'Trash Bins Series 1A',
                4
            );


            /*
            More Plush Towels
            */

            add(
                'Hospitality',
                'Plush Towels Series 4'
            );

            add(
                'Hospitality',
                'Plush Towels Series 5'
            );


            /*
            Chinaware - yuanhui 02
            */

            dashSeries(
                'Hospitality',
                'Chinaware - yuanhui 02',
                4
            );


            /*
            Butler trolley
            */

            add(
                'Hospitality',
                'Butler Trolley 1',
                'jpg'
            );


            /*
            Linen Cart 2a
            */

            dashSeries(
                'Hospitality',
                'Linen Cart 2a',
                3
            );


            /*
            Plush Towels 5
            */

            add(
                'Hospitality',
                'Plush Towels 5'
            );


            /*
            Melamine White 1
            */

            dashSeries(
                'Hospitality',
                'Melamine White 1',
                16
            );


            /*
            Pool Towels
            */

            dashSeries(
                'Hospitality',
                'Pool Towel 1',
                2
            );


            /*
            Slim Housekeeping Cart
            */

            dashSeries(
                'Hospitality',
                'Slim Housekeeping Cart 1',
                3
            );


            /*
            Flatware
            */

            add(
                'Hospitality',
                'Flatware 1',
                'jpg'
            );


            /*
            Fold-up Stanchions
            */

            series(
                'Hospitality',
                'Fold up Stanchion',
                2
            );


            /*
            Hair Dryers
            */

            series(
                'Hospitality',
                'Hair Dryer',
                2
            );


            /*
            SECOND GREEN EDGE COLLECTION
            This is separate from the first Green Edge group.
            */

            dashSeries(
                'Hospitality',
                'Melamine Green Edge Series 1',
                17
            );


            /*
            Portable Utility Carts
            */

            dashSeries(
                'Hospitality',
                'Portable Utility Cart 2',
                2
            );


            /*
            Hand Towels
            */

            add(
                'Hospitality',
                'Plush Hand Towels'
            );


            /*
            Three Tier Carts
            */

            series(
                'Hospitality',
                'Three Tier Cart',
                3
            );


            /*
            Wash Cloth
            */

            add(
                'Hospitality',
                'Plush Wash Cloth'
            );


            /*
            Melamine White Series 2
            Total = 23 images
            */

            dashSeries(
                'Hospitality',
                'Melamine White Series 2',
                23
            );


            /*
            Melamine collection
            */

            series(
                'Hospitality',
                'Melamine',
                7
            );


            /*
            Mini Bar Fridges
            */

            series(
                'Hospitality',
                'Mini Bar Fridge',
                2
            );


            /*
            Plush Towels 6-piece set
            */

            add(
                'Hospitality',
                'Plush Towels 6 piece set'
            );


            /*
            Plush Towel Set 3 x 2
            */

            add(
                'Hospitality',
                'Plush Towel Set 3 x 2'
            );


            /*
            Chinaware - yuanhua 02
            */

            dashSeries(
                'Hospitality',
                'Chinaware - yuanhua 02',
                19
            );


            /*
            Light Changing Class
            Name retained exactly as supplied.
            */

            series(
                'Hospitality',
                'Light Changing Class',
                2
            );


            /*
            Light Changing Cups
            */

            series(
                'Hospitality',
                'Light Changing Cups',
                2
            );


            /*
            Bus Trolleys
            */

            series(
                'Hospitality',
                'Bus Trolley',
                2
            );


            /*
            Speed Rack
            */

            add(
                'Hospitality',
                'Speed Rack 3 Shelves'
            );


            /*
            Double Stack Towels
            */

            add(
                'Hospitality',
                'Plush Towels Double Stack x 6'
            );



            /*
            ======================================================
            RETURN DATA TO ALPINE
            ======================================================
            */

            return {

                filter: 'all',

                products: products,

                get filteredProducts() {

                    if (this.filter === 'all') {

                        return this.products;

                    }

                    return this.products.filter(
                        product =>
                            product.category === this.filter
                    );

                }

            };

        }

    </script>


</body>
</html>
