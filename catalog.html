    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: '#020b18',
                        panel: '#04152d',
                        accent: '#06b6d4',
                        primary: '#3b82f6'
                    },

                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Outfit', 'sans-serif']

                }

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;800&display=swap"

    >

    <style>

        body {
            background-color: #020b18;
            color: #f8fafc;
            overflow-x: hidden;
            font-family: 'Inter', sans-serif;
        }

        .mesh-bg {
            background-color: #020b18;

            background-image:
                radial-gradient(
                    at 0% 0%,
                    rgba(34, 211, 238, 0.15) 0px,
                    transparent 50%
                ),
                radial-gradient(
                    at 100% 100%,
                    rgba(59, 130, 246, 0.15) 0px,
                    transparent 50%
                );

            background-attachment: fixed;
        }

        .glass-nav {
            background: rgba(4, 21, 45, 0.6);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .filter-shell {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
        }

        /*
        ==========================================================
        PRODUCT CARD
        ==========================================================
        */

        .catalog-card {
            background: #ffffff;
            border-radius: 16px;
            overflow: hidden;

            display: flex;
            flex-direction: column;

            position: relative;

            border: 1px solid rgba(255, 255, 255, 0.12);

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.22);

            transition:
                border-color 0.25s ease,
                box-shadow 0.25s ease;
        }

        /*
        Card itself stays stationary.
        */

        .catalog-card:hover {
            border-color: rgba(34, 211, 238, 0.65);

            box-shadow:
                0 15px 35px rgba(6, 182, 212, 0.20);
        }

        /*
        IMAGE AREA
        */

        .catalog-image-area {
            background: #ffffff;
            height: 300px;

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;
            overflow: hidden;
        }

        .catalog-image {
            width: 100%;
            height: 300px;

            object-fit: contain;

            padding: 18px;

            transition:
                transform 0.45s ease;

            transform-origin: center center;
        }

        /*
        Only image enlarges.
        */

        .catalog-card:hover .catalog-image {
            transform: scale(1.22);
        }

        /*
        PRODUCT DESCRIPTION
        */

        .product-description {
            background: #04152d;

            color: #ffffff;

            min-height: 72px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            text-align: center;

            padding: 14px 12px;

            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .product-name {
            font-family: 'Outfit', sans-serif;
            font-size: 16px;
            font-weight: 700;
            line-height: 1.25;
            color: #ffffff;
        }

        .product-category {
            font-size: 10px;
            font-weight: 700;

            text-transform: uppercase;
            letter-spacing: 0.12em;

            color: #22d3ee;

            margin-top: 6px;
        }

        /*
        Missing image diagnostic
        */

        .missing-image {
            display: none;

            position: absolute;
            inset: 0;

            align-items: center;
            justify-content: center;

            text-align: center;

            background: #ffffff;
            color: #334155;

            padding: 25px;

            font-size: 12px;
            font-weight: 700;

            word-break: break-word;
        }

        [x-cloak] {
            display: none !important;
        }

    </style>
</head>

    <main

            <!-- PAGE TITLE + CATEGORY BUTTONS -->

            >

                <div class="max-w-2xl">

                    <h1
                        class="text-4xl md:text-5xl font-display font-bold mb-4 text-white"
                    >
                        Our Complete Catalog
                    </h1>

                    <p class="text-gray-400">
                        Browse our Technology, Hospitality and Marine product collections.
                    </p>

                </div>


                <!-- CATEGORY FILTERS -->

                <div
                    class="flex flex-wrap gap-2 p-1.5 filter-shell rounded-xl"
                >

                    <template
                        x-for="item in filters"
                        :key="item.value"
                    >

                        <button
                            type="button"

                            @click="filter = item.value"

                            :class="
                                filter === item.value
                                ? 'bg-cyan-500 text-dark shadow-md'
                                : 'text-gray-400 hover:text-white'
                            "

                            class="px-5 py-2 rounded-lg text-sm font-bold transition-all"

                            x-text="item.label"
                        >
                        </button>

                    </template>

                </div>

            </div>



            <!-- ==================================================
                 PRODUCT GRID
                 ================================================== -->

            <div
                x-cloak
                class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"
            >

                <template
                    x-for="product in filteredProducts"
                    :key="product.filename"
                >

                    <div class="catalog-card">


                        <!-- PRODUCT IMAGE -->

                        <div class="catalog-image-area">

                            <img
                                class="catalog-image"

                                :src="product.image"

                                :alt="product.name"

                                :title="product.name"

                                loading="lazy"

                                @error="
                                    $el.style.display = 'none';
                                    $el.nextElementSibling.style.display = 'flex';
                                "
                            >

                            <div
                                class="missing-image"

                                x-text="
                                    'Image filename not found: ' +
                                    product.filename
                                "
                            >
                            </div>

                        </div>


                        <!-- PRODUCT DESCRIPTION -->

                        <div class="product-description">

                            <div
                                class="product-name"
                                x-text="product.name"
                            >
                            </div>

                            <div
                                class="product-category"
                                x-text="product.category"
                            >
                            </div>

                        </div>


                    </div>

                </template>

            </div>

        </div>

            /*
            ======================================================
            BUILD PRODUCT INFORMATION FROM FILENAMES
            ======================================================
            */

            const products = filenames.map(filename => {

                const withoutExt =
                    filename.replace(/\.[^.]+$/, '');

                const parts =
                    withoutExt.split('__');

                const category =
                    parts[0];

                const rawName =
                    parts.slice(1).join('__');


                /*
                Remove trailing image numbers from description.
                Example:
                Bus Trolley 1
                becomes:
                Bus Trolley
                */

                const displayName =
                    rawName
                        .replace(/\s+-\s+\d+$/, '')
                        .replace(/\s+\d+$/, '');


                return {

                    filename: filename,

                    category:
                        category.toLowerCase(),

                    name:
                        displayName,

                    image:
                        'images/' + filename

                };

            });

            ALPINE DATA

                        label: 'Marine'
                    }

                ],

                products: products,


                get filteredProducts() {

                    if (this.filter === 'all') {

                        return this.products;

                    }

                    return this.products.filter(

                        product =>
                            product.category === this.filter

                    );

                }

            };

        }

    </script>
